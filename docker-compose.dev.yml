services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    # Dev: hot-reload when `backend/app/**` changes
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - redis
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]

  notifications_service:
    image: node:20-alpine
    working_dir: /app
    env_file:
      - ./.env
    environment:
      PORT: 8010
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NOTIF_REDIS_CHANNEL: ${NOTIF_REDIS_CHANNEL:-notif.events}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app_password}@mysql:${MYSQL_PORT:-3306}/${MYSQL_DB:-face_attendance}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./notifications_service:/app
      - notifications_node_modules:/app/node_modules
    ports:
      - "8010:8010"
    depends_on:
      - redis
      - mysql
    command: ["sh", "-lc", "npm install && npm run prisma:generate && npm run dev"]

  frontend_dev:
    # Dev: Vite HMR (no nginx, no static build)
    image: node:20-alpine
    working_dir: /app
    environment:
      # Vite proxy inside container -> backend service name
      VITE_BACKEND_URL: http://backend:8000
      VITE_NOTIF_URL: http://notifications_service:8010
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - notifications_service
    command: ["sh", "-lc", "npm install && npm run dev"]

volumes:
  frontend_node_modules:
  notifications_node_modules:
