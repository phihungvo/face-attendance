services:
  backend:
    # Dev: hot-reload when `backend/app/**` changes
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]

  attendance_worker:
    volumes:
      - ./backend/app:/app/app
    command: ["python", "-m", "app.workers.attendance_evidence_worker"]

  attendance_cleanup:
    volumes:
      - ./backend/app:/app/app
    command:
      - sh
      - -lc
      - while true; do python -m app.jobs.attendance_evidence_cleanup; sleep 86400; done

  frontend_dev:
    # Dev: Vite HMR (no nginx, no static build)
    image: node:20-alpine
    working_dir: /app
    environment:
      # Vite proxy inside container -> backend service name
      VITE_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: ["sh", "-lc", "npm install && npm run dev"]

volumes:
  frontend_node_modules:
