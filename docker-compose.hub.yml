services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-db_name}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pssword}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pssword}
    volumes:
      - mysql_data_hub:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-pssword}" ]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: ${BACKEND_IMAGE:-hungvo24101111/face-attendance-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_started
    ports:
      - "8000:8000"

  attendance_worker:
    image: ${BACKEND_IMAGE:-hungvo24101111/face-attendance-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: [ "python", "-m", "app.workers.attendance_evidence_worker" ]
    env_file:
      - ./.env
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_started

  attendance_cleanup:
    image: ${BACKEND_IMAGE:-hungvo24101111/face-attendance-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
      - sh
      - -lc
      - while true; do python -m app.jobs.attendance_evidence_cleanup; sleep 86400; done
    env_file:
      - ./.env
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_started

  ml:
    image: ${ML_IMAGE:-hungvo24101111/face-attendance-ml}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - insightface_cache:/root/.insightface

  frontend:
    image: ${FRONTEND_IMAGE:-hungvo24101111/face-attendance-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "9010:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password}
    volumes:
      - minio_data_hub:/data

volumes:
  mysql_data_hub:
  insightface_cache:
  minio_data_hub:
  attendance_evidence_spool: