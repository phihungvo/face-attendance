name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  APP_SLUG: face-attendance
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/face-attendance-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/face-attendance-frontend
  ML_IMAGE: ghcr.io/${{ github.repository_owner }}/face-attendance-ml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push ml
        uses: docker/build-push-action@v6
        with:
          context: ./ml_service
          file: ./ml_service/Dockerfile
          push: true
          tags: |
            ${{ env.ML_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.ML_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout (for compose file)
        uses: actions/checkout@v4

      - name: Upload compose + env sample to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,.env.sample"
          target: ${{ secrets.VPS_APP_DIR }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          ML_IMAGE: ${{ env.ML_IMAGE }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,BACKEND_IMAGE,FRONTEND_IMAGE,ML_IMAGE,GHCR_USER,GHCR_TOKEN,FRONTEND_PORT
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"

            if [ ! -f .env ]; then
              echo "Missing .env in VPS_APP_DIR. Create it first (copy from .env.sample then edit)." >&2
              exit 1
            fi

            # Replace placeholders only once (keep file in repo generic).
            if grep -q "REPLACE_OWNER" docker-compose.prod.yml; then
              sed -i.bak "s#ghcr.io/REPLACE_OWNER/#ghcr.io/${GHCR_USER}/#g" docker-compose.prod.yml
            fi

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi

            export IMAGE_TAG="${IMAGE_TAG}"
            export BACKEND_IMAGE="${BACKEND_IMAGE}"
            export FRONTEND_IMAGE="${FRONTEND_IMAGE}"
            export ML_IMAGE="${ML_IMAGE}"
            export FRONTEND_PORT="${FRONTEND_PORT:-80}"

            # GHCR pulls can occasionally fail on some VPS networks (connection reset).
            # Retry pull with limited parallelism to improve stability.
            export COMPOSE_PARALLEL_LIMIT=1
            for i in 1 2 3 4 5; do
              echo "docker compose pull (attempt ${i}/5)..."
              if docker compose -f docker-compose.prod.yml pull; then
                break
              fi
              if [ "${i}" -eq 5 ]; then
                echo "docker compose pull failed after 5 attempts" >&2
                exit 1
              fi
              sleep $((i * 10))
            done
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f || true
