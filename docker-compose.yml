services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-face_attendance}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ml:
        condition: service_started
    ports:
      - "8000:8000"

  ml:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      # Cache InsightFace models to avoid re-downloading each container start
      - insightface_cache:/root/.insightface

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
      - notifications_service
    ports:
      - "3000:80"

  notifications_service:
    build:
      context: ./notifications_service
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      PORT: 8010
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NOTIF_REDIS_CHANNEL: ${NOTIF_REDIS_CHANNEL:-notif.events}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app_password}@mysql:${MYSQL_PORT:-3306}/${MYSQL_DB:-face_attendance}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      - mysql
      - redis
    ports:
      - "8010:8010"

  phpmyadmin:
    profiles: ["tools"]
    image: phpmyadmin:5.2
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"

volumes:
  mysql_data:
  insightface_cache:
  redis_data:
