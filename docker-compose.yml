services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-face_attendance}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - attendance_evidence_spool:/tmp/attendance-evidence-spool
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"

  attendance_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    command: ["python", "-m", "app.workers.attendance_evidence_worker"]
    volumes:
      - attendance_evidence_spool:/tmp/attendance-evidence-spool
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

  attendance_cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    command:
      - sh
      - -lc
      - while true; do python -m app.jobs.attendance_evidence_cleanup; sleep 86400; done
    volumes:
      - attendance_evidence_spool:/tmp/attendance-evidence-spool
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

  ml:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      # Cache InsightFace models to avoid re-downloading each container start
      - insightface_cache:/root/.insightface

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

  phpmyadmin:
    profiles: ["tools"]
    image: phpmyadmin:5.2
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"

  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9010:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  insightface_cache:
  minio_data:
  attendance_evidence_spool:
